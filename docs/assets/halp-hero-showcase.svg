<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="Halp Visual Showcase across One-Tap Share Page, Web &amp; Desktop App, and OBS Stream Overlay">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <radialGradient id="glow-blue" cx="40%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#0070f3" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0070f3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-amber" cx="15%" cy="70%" r="40%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-pink" cx="85%" cy="60%" r="40%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>

    <!-- Card Background Gradients -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="center-card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="obs-bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>

    <!-- UI Accent Gradients -->
    <linearGradient id="blue-btn-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0070f3"/>
      <stop offset="100%" stop-color="#0051b3"/>
    </linearGradient>
    <linearGradient id="pill-glow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#0070f3"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow-card" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="shadow-featured" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#0070f3" flood-opacity="0.2"/>
    </filter>
    <filter id="shadow-toast" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="520" fill="url(#bg-grad)"/>
  <rect width="1200" height="520" fill="url(#glow-blue)"/>
  <rect width="1200" height="520" fill="url(#glow-amber)"/>
  <rect width="1200" height="520" fill="url(#glow-pink)"/>

  <!-- Subtle Background Grid Pattern -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="150" y1="0" x2="150" y2="520"/>
    <line x1="300" y1="0" x2="300" y2="520"/>
    <line x1="450" y1="0" x2="450" y2="520"/>
    <line x1="600" y1="0" x2="600" y2="520"/>
    <line x1="750" y1="0" x2="750" y2="520"/>
    <line x1="900" y1="0" x2="900" y2="520"/>
    <line x1="1050" y1="0" x2="1050" y2="520"/>
  </g>

  <!-- ======================================================================= -->
  <!-- CARD 1 (LEFT): One-Tap Share Page (halp.to/h/e7k4p2m9qx3va)             -->
  <!-- ======================================================================= -->
  <g transform="translate(30, 35)" filter="url(#shadow-card)">
    <!-- Window Frame -->
    <rect width="360" height="450" rx="16" fill="url(#card-grad)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    
    <!-- Titlebar -->
    <rect width="360" height="42" rx="16" fill="#1e293b"/>
    <rect y="26" width="360" height="16" fill="#1e293b"/>
    <line x1="0" y1="42" x2="360" y2="42" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    
    <!-- Window Traffic Lights -->
    <circle cx="24" cy="21" r="5" fill="#ef4444"/>
    <circle cx="40" cy="21" r="5" fill="#f59e0b"/>
    <circle cx="56" cy="21" r="5" fill="#10b981"/>

    <!-- URL Pill -->
    <rect x="76" y="11" width="268" height="20" rx="6" fill="#0f172a" stroke="rgba(255,255,255,0.05)"/>
    <text x="88" y="25" class="font-mono" font-size="10.5" fill="#94a3b8">halp.to/h/e7k4p2m9qx3va</text>

    <!-- Card Content -->
    <g class="font-sans" text-anchor="middle">
      <!-- Badge -->
      <rect x="110" y="68" width="140" height="22" rx="11" fill="rgba(245,158,11,0.12)" stroke="rgba(245,158,11,0.3)"/>
      <text x="180" y="83" font-size="11" font-weight="600" fill="#f59e0b">One-Tap Appreciation</text>

      <!-- Main Headline (Verbatim docs/UI.md §1) -->
      <text x="180" y="125" font-size="19" font-weight="700" fill="#f8fafc">Someone appreciates you.</text>
      <text x="180" y="148" font-size="12" fill="#94a3b8">Send a person an anonymous ping.</text>

      <!-- State 1: Active Button ("Appreciate them") -->
      <g transform="translate(65, 175)">
        <rect width="230" height="42" rx="21" fill="#f8fafc" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.3))"/>
        <text x="115" y="26" font-size="13.5" font-weight="600" fill="#0f172a">Appreciate them</text>
      </g>

      <!-- Transition Indicator -->
      <g transform="translate(180, 242)">
        <text y="0" font-size="11" fill="#64748b" font-weight="500">300 ms uniform latency floor</text>
        <path d="M-6,8 L0,14 L6,8" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
      </g>

      <!-- State 2: Sent State ("Sent.") -->
      <g transform="translate(65, 275)">
        <rect width="230" height="40" rx="20" fill="#334155" stroke="rgba(255,255,255,0.1)"/>
        <text x="115" y="25" font-size="13.5" font-weight="600" fill="#94a3b8">Sent.</text>
        <circle cx="165" cy="20" r="3" fill="#10b981"/>
      </g>

      <!-- Verbatim Caption (docs/UI.md §1) -->
      <text x="180" y="348" font-size="12.5" font-weight="500" fill="#94a3b8">Anonymous. No message.</text>
      <text x="180" y="366" font-size="12.5" font-weight="500" fill="#94a3b8">They never learn it was you.</text>

      <!-- Trust Footer Box -->
      <rect x="35" y="395" width="290" height="32" rx="8" fill="rgba(15,23,42,0.8)" stroke="rgba(255,255,255,0.06)"/>
      <text x="180" y="415" font-size="11" fill="#64748b">No login required · Pure zero-knowledge</text>
    </g>
  </g>

  <!-- ======================================================================= -->
  <!-- CARD 2 (CENTER): Web & Desktop App (halp.to/app) [Elevated Feature]      -->
  <!-- ======================================================================= -->
  <g transform="translate(420, 20)" filter="url(#shadow-featured)">
    <!-- Window Frame -->
    <rect width="360" height="480" rx="16" fill="url(#center-card-grad)" stroke="#0070f3" stroke-width="1.5"/>
    
    <!-- Titlebar -->
    <rect width="360" height="42" rx="16" fill="#1e293b"/>
    <rect y="26" width="360" height="16" fill="#1e293b"/>
    <line x1="0" y1="42" x2="360" y2="42" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    
    <!-- Window Traffic Lights -->
    <circle cx="24" cy="21" r="5" fill="#ef4444"/>
    <circle cx="40" cy="21" r="5" fill="#f59e0b"/>
    <circle cx="56" cy="21" r="5" fill="#10b981"/>

    <!-- URL Pill -->
    <rect x="76" y="11" width="268" height="20" rx="6" fill="#0b1120" stroke="rgba(0,112,243,0.3)"/>
    <circle cx="88" cy="21" r="3.5" fill="#10b981"/>
    <text x="98" y="25" class="font-mono" font-size="10.5" fill="#e2e8f0">halp.to/app · connected</text>

    <!-- Card Content -->
    <g class="font-sans">
      <!-- Floating Push Notification Toast -->
      <g transform="translate(20, 56)" filter="url(#shadow-toast)">
        <rect width="320" height="54" rx="12" fill="rgba(30,41,59,0.95)" stroke="rgba(0,112,243,0.4)" stroke-width="1"/>
        <!-- Bell / Sparkle Icon -->
        <rect x="12" y="12" width="30" height="30" rx="8" fill="rgba(0,112,243,0.15)"/>
        <text x="27" y="32" text-anchor="middle" font-size="15" fill="#38bdf8">♥</text>
        <!-- Toast Copy (Verbatim docs/UI.md §8) -->
        <text x="52" y="27" font-size="12.5" font-weight="700" fill="#ffffff">Someone appreciates you.</text>
        <text x="52" y="42" font-size="10.5" fill="#94a3b8">Web Push &amp; Desktop Tray · Just now</text>
      </g>

      <!-- Today Counter Banner -->
      <g transform="translate(24, 126)">
        <text x="0" y="18" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.5">TODAY'S ARRIVALS</text>
        <text x="0" y="42" font-size="20" font-weight="800" fill="#38bdf8">14 people appreciated you.</text>
      </g>

      <!-- Handles Section -->
      <g transform="translate(24, 192)">
        <text x="0" y="0" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.5">YOUR PUBLIC HANDLES</text>

        <!-- Handle Row 1 -->
        <g transform="translate(0, 12)">
          <rect width="312" height="42" rx="8" fill="rgba(15,23,42,0.8)" stroke="rgba(255,255,255,0.06)"/>
          <text x="14" y="22" class="font-mono" font-size="12" font-weight="600" fill="#f8fafc">e7k4p2m9qx3va</text>
          <text x="14" y="34" font-size="10" fill="#64748b">GitHub README · personal</text>
          <rect x="238" y="11" width="60" height="20" rx="10" fill="rgba(16,185,129,0.12)"/>
          <text x="268" y="25" text-anchor="middle" font-size="10" font-weight="600" fill="#10b981">Active</text>
        </g>

        <!-- Handle Row 2 -->
        <g transform="translate(0, 60)">
          <rect width="312" height="42" rx="8" fill="rgba(15,23,42,0.8)" stroke="rgba(255,255,255,0.06)"/>
          <text x="14" y="22" class="font-mono" font-size="12" font-weight="600" fill="#f8fafc">@kenth</text>
          <text x="14" y="34" font-size="10" fill="#64748b">Personal Alias · public</text>
          <rect x="238" y="11" width="60" height="20" rx="10" fill="rgba(16,185,129,0.12)"/>
          <text x="268" y="25" text-anchor="middle" font-size="10" font-weight="600" fill="#10b981">Active</text>
        </g>

        <!-- Handle Row 3 -->
        <g transform="translate(0, 108)">
          <rect width="312" height="42" rx="8" fill="rgba(15,23,42,0.8)" stroke="rgba(255,255,255,0.06)"/>
          <text x="14" y="22" class="font-mono" font-size="12" font-weight="600" fill="#f8fafc">Team Core</text>
          <text x="14" y="34" font-size="10" fill="#64748b">Group · 8 members</text>
          <rect x="230" y="11" width="68" height="20" rx="10" fill="rgba(0,112,243,0.15)"/>
          <text x="264" y="25" text-anchor="middle" font-size="10" font-weight="600" fill="#38bdf8">min 5 (ok)</text>
        </g>
      </g>

      <!-- Quick Actions -->
      <g transform="translate(24, 380)">
        <!-- Share Link Button -->
        <rect width="148" height="34" rx="17" fill="url(#blue-btn-grad)"/>
        <text x="74" y="22" text-anchor="middle" font-size="11.5" font-weight="600" fill="#ffffff">Copy Share Link</text>

        <!-- QR Code Button -->
        <rect x="156" width="72" height="34" rx="17" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.12)"/>
        <text x="192" y="22" text-anchor="middle" font-size="11.5" font-weight="600" fill="#e2e8f0">QR Code</text>

        <!-- Badge Button -->
        <rect x="236" width="76" height="34" rx="17" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.12)"/>
        <text x="274" y="22" text-anchor="middle" font-size="11.5" font-weight="600" fill="#e2e8f0">SVG Badge</text>
      </g>

      <!-- Key Wall Reminder Sentence -->
      <text x="180" y="445" text-anchor="middle" font-size="10.5" fill="#64748b">This is your account. There is no email, no password and no reset.</text>
    </g>
  </g>

  <!-- ======================================================================= -->
  <!-- CARD 3 (RIGHT): OBS Live Stream Overlay (/overlay/9f8a...)              -->
  <!-- ======================================================================= -->
  <g transform="translate(810, 35)" filter="url(#shadow-card)">
    <!-- Window Frame -->
    <rect width="360" height="450" rx="16" fill="url(#obs-bg-grad)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    
    <!-- Titlebar -->
    <rect width="360" height="42" rx="16" fill="#111827"/>
    <rect y="26" width="360" height="16" fill="#111827"/>
    <line x1="0" y1="42" x2="360" y2="42" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    
    <!-- Window Traffic Lights -->
    <circle cx="24" cy="21" r="5" fill="#ef4444"/>
    <circle cx="40" cy="21" r="5" fill="#f59e0b"/>
    <circle cx="56" cy="21" r="5" fill="#10b981"/>

    <!-- URL Pill -->
    <rect x="76" y="11" width="268" height="20" rx="6" fill="#030712" stroke="rgba(255,255,255,0.05)"/>
    <text x="88" y="25" class="font-mono" font-size="10.5" fill="#94a3b8">halp.to/overlay/9f8a2c1b...</text>

    <!-- Simulated Stream Environment -->
    <g transform="translate(16, 56)">
      <!-- Stream Preview Box -->
      <rect width="328" height="230" rx="12" fill="#070b14" stroke="rgba(255,255,255,0.06)"/>

      <!-- Ambient Stream Lighting & Gameplay Mockup -->
      <circle cx="164" cy="90" r="80" fill="url(#glow-pink)" opacity="0.4"/>
      <circle cx="280" cy="180" r="60" fill="url(#glow-blue)" opacity="0.3"/>
      
      <!-- Video stream wireframe elements -->
      <rect x="16" y="16" width="60" height="16" rx="4" fill="rgba(239,68,68,0.2)"/>
      <circle cx="26" cy="24" r="3" fill="#ef4444"/>
      <text x="34" y="27" class="font-sans" font-size="9" font-weight="700" fill="#ef4444">LIVE</text>
      <text x="84" y="27" class="font-sans" font-size="9" fill="#64748b">1080p60 · OBS Browser Source</text>

      <!-- Glowing Pop-In Overlay Widget (Verbatim docs/UI.md §8 + Phase 3) -->
      <g transform="translate(24, 140)">
        <!-- Glass Pop-in Card -->
        <rect width="280" height="52" rx="26" fill="rgba(18,18,18,0.92)" stroke="rgba(255,255,255,0.2)" stroke-width="1.2" filter="drop-shadow(0 6px 16px rgba(0,0,0,0.6))"/>
        
        <!-- Glowing Heart Icon -->
        <circle cx="30" cy="26" r="14" fill="rgba(236,72,153,0.18)"/>
        <text x="30" y="31" class="font-sans" text-anchor="middle" font-size="15" fill="#f43f5e">♥</text>

        <!-- Overlay Text -->
        <text x="54" y="31" class="font-sans" font-size="14" font-weight="700" fill="#ffffff">14 people appreciate you.</text>

        <!-- Animated Progress Meter Track -->
        <rect x="54" y="38" width="206" height="4" rx="2" fill="rgba(255,255,255,0.15)"/>
        <rect x="54" y="38" width="144" height="4" rx="2" fill="url(#blue-btn-grad)"/>
      </g>
    </g>

    <!-- Streamer Protection Features -->
    <g transform="translate(24, 305)" class="font-sans">
      <text x="0" y="0" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.5">RAID-PROOF PROTECTION</text>

      <!-- Feature 1 -->
      <g transform="translate(0, 14)">
        <circle cx="6" cy="6" r="3" fill="#0070f3"/>
        <text x="16" y="10" font-size="11.5" font-weight="600" fill="#e2e8f0">60s Coalesced Digest Window</text>
        <text x="16" y="24" font-size="10" fill="#64748b">Incoming raids aggregate into 1 clean animation</text>
      </g>

      <!-- Feature 2 -->
      <g transform="translate(0, 48)">
        <circle cx="6" cy="6" r="3" fill="#10b981"/>
        <text x="16" y="10" font-size="11.5" font-weight="600" fill="#e2e8f0">Instant Token Revocation</text>
        <text x="16" y="24" font-size="10" fill="#64748b">Rotate overlay token in 1 click without burning handle</text>
      </g>

      <!-- Feature 3 -->
      <g transform="translate(0, 82)">
        <circle cx="6" cy="6" r="3" fill="#ec4899"/>
        <text x="16" y="10" font-size="11.5" font-weight="600" fill="#e2e8f0">Zero Sender Reveal (Invariant 6)</text>
        <text x="16" y="24" font-size="10" fill="#64748b">No usernames, chat text, or trolling on stream</text>
      </g>
    </g>
  </g>
</svg>
