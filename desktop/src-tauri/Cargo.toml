[package]
name = "halp-desktop"
version = "0.1.0"
description = "Halp Desktop App — Anonymous Appreciation"
authors = ["Halp Contributors"]
license = "Apache-2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-notification = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
keyring = "2.1"
aes-gcm = "0.10"
sha2 = "0.10"
hkdf = "0.12"
rand = "0.8"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
