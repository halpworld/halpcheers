name: Bug Report
description: Report a bug or unexpected behavior in Halp
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        > [!CAUTION]
        > **NEVER SHARE PRIVATE CREDENTIALS**: Do not paste a real 16-digit account key, HKDF auth secrets, raw contact blobs, or sensitive push tokens in this issue. Halp is built on strict zero-knowledge and sender-anonymity principles.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of Halp is affected?
      options:
        - "server (halpd)"
        - "web/core & web/app"
        - "extension (Chrome/Firefox)"
        - "desktop (Tauri)"
        - "tui (halp / halp-bot)"
        - "docs / deployment"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the behavior.
      placeholder: |
        1. Start server with `...`
        2. Send request to `...`
        3. See unexpected behavior `...`
    validations:
      required: true

  - type: textarea
    id: expected-actual
    attributes:
      label: Expected vs. Actual Behavior
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment & Version Info
      description: Please share relevant environment details (OS, Go version, Node version, Browser, or Tauri version).
      placeholder: |
        - OS: [e.g. macOS 15, Ubuntu 24.04, Windows 11]
        - Go Version: [e.g. 1.26.0]
        - Node Version: [e.g. 22.0.0]
        - Halp Version / Commit SHA:
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation Checklist
      options:
        - label: I have verified that NO 16-digit account keys, secrets, or user-identifying data are included in this issue.
          required: true
        - label: I have searched existing issues to ensure this bug has not already been reported.
          required: true
