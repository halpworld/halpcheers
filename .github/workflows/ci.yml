name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  server-and-go:
    name: Go Subsystems & Red-Team Suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'server/go.mod'
          cache: true

      - name: Verify Frozen Contracts
        run: |
          git diff --exit-code server/internal/core server/internal/http/router.go

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Go Build (All Modules)
        run: go build ./server/... ./tui/... ./redteam/... ./loadtest/...

      - name: Go Vet (All Modules)
        run: go vet ./server/... ./tui/... ./redteam/... ./loadtest/...

      - name: Staticcheck
        run: staticcheck -checks "inherit,-SA1019,-ST1005,-S1021" ./server/... ./tui/... ./redteam/... ./loadtest/...

      - name: Go Test with Race Detector
        run: go test -v -race ./server/... ./tui/... ./loadtest/...

      - name: Red-Team Exit Criteria Suite
        run: go test -v -race ./redteam/...

      - name: Invariant 9 Check (No Identifier Leaks)
        run: |
          go run ./server/cmd/check-invariant9 ./server
          go run ./server/cmd/check-invariant9 ./tui

  web-and-clients:
    name: Web Core, Web App & Client Suites
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build & Test Web Core (@halp/core)
        run: |
          npm ci --prefix web/core
          npm test --prefix web/core
          npm run build --prefix web/core

      - name: Build & Test Web App (@halp/app)
        run: |
          npm ci --prefix web/app
          npm run build --prefix web/app
          npm test --prefix web/app

      - name: Build & Test Browser Extension (@halp/extension)
        run: |
          npm ci --prefix extension
          npm run build --prefix extension
          npm test --prefix extension

      - name: Build & Test Desktop Frontend (@halp/desktop)
        run: |
          npm ci --prefix desktop
          npm run build --prefix desktop
          npm test --prefix desktop
