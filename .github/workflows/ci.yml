name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

defaults:
  run:
    working-directory: server

jobs:
  test:
    name: Build, Vet, Staticcheck, Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
          cache-dependency-path: server/go.sum

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Go Build
        run: go build ./...

      - name: Go Vet
        run: go vet ./...

      - name: Staticcheck
        run: staticcheck ./...

      - name: Go Test with Race Detector
        run: go test -race ./...

      - name: Invariant 9 Check (No Identifier Leaks)
        run: go run ./cmd/check-invariant9 .

      - name: Red-Team Exit Criteria Suite
        working-directory: redteam
        run: go test -v -race ./...
